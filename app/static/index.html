<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo Shop</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --ink:#1b1f24; --muted:#5b6470; --line:#dde2e8; --ok:#1a7f37; --bad:#cf222e; --accent:#2f6feb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#171a21; --ink:#e6e9ee; --muted:#9aa4b2; --line:#2a2f3a; --ok:#3fb950; --bad:#f85149; --accent:#58a6ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.num { font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .ok { color: var(--ok); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .kv { min-width: 140px; } .kv b { display:block; font-size: 20px; }
  .muted { color: var(--muted); font-size: 13px; }
  #log li { font-size: 13px; color: var(--muted); }
  code { font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Echo Shop</h1>
  <p class="sub">재고 차감 주문으로 보는 요청 기록 재생 — 원본 DB 가 갑자기 죽어도 받은 주문이 사라지지 않는지 확인합니다.</p>

  <section class="card row">
    <div class="kv"><span class="muted">응답 환경</span><b id="env">-</b></div>
    <div class="kv"><span class="muted">주문 수</span><b id="orders">-</b></div>
    <div class="kv"><span class="muted">재고 대조 (처음 − 주문 = 지금)</span><b id="consistent">-</b></div>
  </section>

  <section class="card">
    <table>
      <thead><tr><th>상품</th><th>처음</th><th>주문</th><th>지금 재고</th><th>대조</th><th></th></tr></thead>
      <tbody id="items"><tr><td colspan="6" class="muted">불러오는 중…</td></tr></tbody>
    </table>
  </section>

  <section class="card">
    <div class="muted">최근 주문 (요청 키 · 받은 환경)</div>
    <ul id="log"></ul>
  </section>
  <p class="muted">API: <code>POST /api/orders {"sku","qty"}</code> (헤더 <code>Idempotency-Key</code>) · <code>GET /api/summary</code></p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  function key() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); }
  async function refresh() {
    try {
      const info = await (await fetch('/api/info', {cache: 'no-store'})).json();
      $('env').textContent = info.environment;
      const r = await fetch('/api/summary', {cache: 'no-store'});
      if (!r.ok) { $('consistent').textContent = 'DB 응답 없음'; $('consistent').className = 'bad'; return; }
      const s = await r.json();
      $('orders').textContent = s.totalOrders;
      $('consistent').textContent = s.consistent ? '맞음' : '어긋남';
      $('consistent').className = s.consistent ? 'ok' : 'bad';
      $('items').innerHTML = '';
      for (const i of s.items) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${i.name} <span class="muted">${i.sku}</span></td><td class="num">${i.initialStock}</td>` +
          `<td class="num">${i.ordered}</td><td class="num"><b>${i.stock}</b></td>` +
          `<td class="${i.consistent ? 'ok' : 'bad'}">${i.consistent ? '맞음' : '어긋남'}</td><td></td>`;
        const b = document.createElement('button');
        b.textContent = '1개 주문'; b.disabled = i.stock <= 0;
        b.onclick = () => order(i.sku);
        tr.lastChild.appendChild(b);
        $('items').appendChild(tr);
      }
      if (!s.items.length) $('items').innerHTML = '<tr><td colspan="6" class="muted">상품이 없습니다 (원본 DB 에 sql/seed.sql)</td></tr>';
      $('log').innerHTML = '';
      for (const o of s.recent) {
        const li = document.createElement('li');
        li.textContent = `${new Date(o.orderedAt).toLocaleTimeString()} · ${o.sku} × ${o.qty} · ${o.environment} · ${o.requestId || '-'}`;
        $('log').appendChild(li);
      }
    } catch (e) { $('consistent').textContent = '연결 실패'; $('consistent').className = 'bad'; }
  }
  async function order(sku) {
    const r = await fetch('/api/orders', { method: 'POST', headers: {'Content-Type': 'application/json', 'Idempotency-Key': key()}, body: JSON.stringify({sku, qty: 1}) });
    if (r.status === 409) alert('재고가 없습니다');
    else if (!r.ok && r.status !== 200) alert('주문 실패: ' + r.status);
    refresh();
  }
  refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
